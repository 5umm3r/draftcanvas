[package]
name = "vtracer-ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
vtracer = "0.6"
visioncortex = "0.8"
image = "0.23"

# panic = "abort" にすると catch_unwind でパニックを捕捉できず、
# vtracer 内部のパニックがアプリ全体を即 abort させるため unwind を使う
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
